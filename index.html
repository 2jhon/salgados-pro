
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fffcf5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Salgados Pro" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081967.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Salgados Manager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
      }
      
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none; /* Desativa menu de contexto em long press */
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #fffcf5;
        color: #1e293b;
        
        /* Comportamento Nativo */
        overscroll-behavior-y: none; /* Remove efeito elástico da página inteira */
        user-select: none; /* Remove seleção de texto */
        -webkit-user-select: none;
      }

      /* Permitir interação em inputs */
      input, textarea, [contenteditable] {
        user-select: text;
        -webkit-user-select: text;
      }

      html { scroll-behavior: smooth; }
      
      @media screen and (max-width: 768px) {
        input, select, textarea { font-size: 16px !important; } /* Previne zoom no iOS */
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Utilitários de Safe Area */
      .safe-top { padding-top: var(--sat); }
      .safe-bottom { padding-bottom: var(--sab); }
      
      /* Animações de Hover Customizadas */
      .hover-lift { transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      .hover-lift:active { transform: scale(0.95); }

      /* Keyframes para Stories */
      @keyframes progress {
        0% { width: 0%; }
        100% { width: 100%; }
      }

      /* Modos de Densidade / Tamanho (Pequeno ... vs Médio ||. vs Grande |||) */
      :root {
        --product-card-w: 280px;
        --product-img-size: 56px;
        --product-title-size: 13px;
        --product-price-size: 12px;
        --product-box-min-h: 56px;
        --product-value-size: 19px;
        --product-input-size: 16px;
      }

      body[data-density="small"] {
        --product-card-w: 195px;
        --product-img-size: 40px;
        --product-title-size: 11px;
        --product-price-size: 10px;
        --product-box-min-h: 44px;
        --product-value-size: 14px;
        --product-input-size: 13px;
        letter-spacing: -0.02em;
      }

      body[data-density="medium"] {
        --product-card-w: 280px;
        --product-img-size: 56px;
        --product-title-size: 13px;
        --product-price-size: 12px;
        --product-box-min-h: 56px;
        --product-value-size: 19px;
        --product-input-size: 16px;
      }

      body[data-density="large"] {
        --product-card-w: min(380px, 92vw);
        --product-img-size: 80px;
        --product-title-size: 17px;
        --product-price-size: 15px;
        --product-box-min-h: 74px;
        --product-value-size: 26px;
        --product-input-size: 22px;
      }

      /* Classes automáticas de escala de card */
      .product-scale-card {
        width: var(--product-card-w) !important;
        max-width: 95vw !important;
      }

      .product-scale-img {
        width: var(--product-img-size) !important;
        height: var(--product-img-size) !important;
      }

      .product-scale-title {
        font-size: var(--product-title-size) !important;
      }

      .product-scale-price {
        font-size: var(--product-price-size) !important;
      }

      .product-scale-box {
        min-height: var(--product-box-min-h) !important;
      }

      .product-scale-val {
        font-size: var(--product-value-size) !important;
      }

      .product-scale-input {
        font-size: var(--product-input-size) !important;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script>
      // Registro antecipado do Service Worker e limpeza de caches obsoletos
      if ('caches' in window) {
        caches.keys().then(names => {
          names.forEach(name => {
            if (name !== 'salgados-pro-v7') {
              caches.delete(name);
            }
          });
        });
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('[PWA] Service Worker registrado:', reg.scope);
              reg.update().catch(() => {});
            })
            .catch(err => console.error('[PWA] Erro ao registrar:', err));
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
